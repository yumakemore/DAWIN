[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dawin"
version = "1.0.1"
description = "Damped Atomic Wave Integration Neurons (DAWIN): A Universal Primitive for Continuous-Time Spatiotemporal Learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Byunggu Yu", email = "byu@udc.edu" },
    { name = "Justin Kim", email = "junwhan.kim@udc.edu" }
]
keywords = [
    "deep-learning",
    "continuous-time",
    "irregular-time-series",
    "state-space-models",
    "pytorch",
    "triton"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
triton = [
    "triton>=3.0.0"
]
benchmarks = [
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "gymnasium[mujoco]>=0.29.0",
    "scikit-learn>=1.3.0"
]

[project.urls]
Homepage = "https://github.com/yumakemore/DAWIN"
Documentation = "https://github.com"
Repository = "https://github.com/yumakemore/DAWIN"
Paper = "https://arxiv.org/abs/2611.30025"
Archive = "https://doi.org/10.5281/zenodo.24485897"

[tool.setuptools.packages.find]
include = ["dawin*"]

